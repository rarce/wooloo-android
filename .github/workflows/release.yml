name: Release

# Pushing a tag vX.Y.Z builds wooloo mobile at that version and publishes the GitHub release with the
# signed APK and update.json. Installed copies read update.json from the latest release
# (UPDATE_FEED_URL in app/build.gradle.kts, read by dev.herdroid.update.AppUpdater), so every release
# must carry it.
#
# The build job runs Gradle with a read-only token and no signing key; only the publish job, which
# builds nothing, can write releases and read the keystore. See docs/updates.md.
#
# The same tag also uploads the Google Play app (dev.wooloo.mobile) to Play's internal track:
# build-play builds the unsigned AAB without secrets, and the play job, in the protected `play`
# environment, signs it with the upload key and uploads it without running Gradle. It is skipped
# with a notice while the Play secrets are missing, and is independent of publish: one failing never
# affects the other. Rehearsals build the AAB but never sign or upload it. See docs/play.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Canonical rehearsal version (artifacts only; never signs or publishes)'
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release source (no secrets)
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$REHEARSAL_VERSION"
          else
            [[ "$GITHUB_REF" == refs/tags/v* ]] || exit 1
            version="${GITHUB_REF_NAME#v}"
          fi
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || {
            echo '::error::Release commit must be reachable from authorized main'; exit 1;
          }
          python3 scripts/release_metadata.py --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: authorize
    env:
      VERSION: ${{ needs.authorize.outputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}

      - name: Validate release metadata rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Test and build the unsigned release
        run: ./gradlew testDebugUnitTest jacocoDebugCoverageVerification paneMetricsCoverageVerification lintDebug assembleDebug assembleRelease -PappVersion="$VERSION" --console=plain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-reports-and-mapping
          path: |
            app/build/reports/
            app/build/outputs/mapping/release/
          retention-days: 90

  # A separate job, so the GitHub APK and the Play AAB never share build outputs or mapping files.
  build-play:
    name: Build Play bundle
    needs: authorize
    env:
      VERSION: ${{ needs.authorize.outputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Build the unsigned Play bundle
        run: ./gradlew bundleRelease -Pplay -PappVersion="$VERSION" --console=plain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Sign and publish
    needs: [authorize, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}

      - name: Set build tools
        run: |
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-apk
          path: build/release

      # Every release must be signed with the same key, or Android refuses to install it as an update.
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.HERDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HERDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HERDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HERDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::The HERDROID_KEYSTORE_BASE64, HERDROID_KEYSTORE_PASSWORD and HERDROID_KEY_ALIAS secrets must be set"
            exit 1
          fi
          export KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          "$BUILD_TOOLS/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "build/release/wooloo-mobile-$VERSION.apk" build/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "build/release/wooloo-mobile-$VERSION.apk"

      # docs/releases/vX.Y.Z.md when written by hand, otherwise GitHub's notes since the last release.
      - name: Release notes
        run: |
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" build/release/notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
              --jq .body > build/release/notes.md
          fi

      - name: Write update.json
        run: |
          apk="wooloo-mobile-$VERSION.apk"
          "$BUILD_TOOLS/aapt2" dump badging "build/release/$apk" > build/release/badging.txt
          python3 scripts/release_metadata.py --version "$VERSION" \
            --apk "build/release/$apk" --notes build/release/notes.md \
            --badging build/release/badging.txt \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$apk" \
            --output build/release/update.json

      - name: Publish
        env:
          EXPECTED_COMMIT: ${{ needs.authorize.outputs.commit }}
        run: |
          set -euo pipefail
          # Refuse a moved/deleted tag rather than attaching artifacts to a different source.
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          [ "$tag_commit" = "$EXPECTED_COMMIT" ] || { echo "::error::Release tag moved"; exit 1; }
          apk="wooloo-mobile-$VERSION.apk"
          hash=$(sha256sum "build/release/$apk" | awk '{print $1}')
          {
            cat build/release/notes.md
            printf '\n## Install\n\n'
            printf 'Download `%s` on your phone and open it (allow installs from your browser when Android asks).\n\n' "$apk"
            printf 'Installed copies update themselves: **Settings → Check for updates**.\n\n'
            printf 'Requires Android 8.0 or later.\n\n'
            printf 'SHA-256 (`sha256sum %s`):\n\n```\n%s\n```\n' "$apk" "$hash"
          } > build/release/body.md
          # The feed is read from the latest release: a fix to an older line must not replace it.
          # An empty successful response means no stable releases; API failures abort publication.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > build/release/stable-tags.txt
          python3 scripts/release_metadata.py --version "$VERSION" \
            --stable-tags build/release/stable-tags.txt \
            --make-latest-output build/release/make-latest.txt
          make_latest=$(cat build/release/make-latest.txt)
          gh release create "$GITHUB_REF_NAME" "build/release/$apk" build/release/update.json \
            --verify-tag --title "wooloo mobile $VERSION" --notes-file build/release/body.md --latest="$make_latest"

  # Uploads to Play's internal track only; promotion to closed testing and production stays manual.
  play:
    name: Sign and upload to Google Play
    needs: [authorize, build-play]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment: play
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - name: Check Play secrets
        id: secrets
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$SERVICE_ACCOUNT_JSON" ] || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          [ -n "$KEYSTORE_BASE64" ] || missing+=(PLAY_UPLOAD_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(PLAY_UPLOAD_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(PLAY_UPLOAD_KEY_ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Google Play upload skipped: the play environment lacks ${missing[*]}. See docs/play.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Only the notes helper and hand-written notes: this job runs no build scripts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
          sparse-checkout: |
            scripts/play_notes.py
            docs/releases
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: unsigned-aab
          path: build/play

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: play-mapping
          path: build/play

      # Play App Signing: Google re-signs for users; this is the upload key Play Console registered.
      # AABs are JARs, so jarsigner (not apksigner) signs them.
      - name: Sign the bundle with the upload key
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keystore="$RUNNER_TEMP/play-upload.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          signed="build/play/wooloo-mobile-$VERSION.aab"
          jarsigner -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -signedjar "$signed" build/play/app-release.aab "$KEY_ALIAS"
          jarsigner -verify "$signed" | tee build/play/verify.txt
          grep -q '^jar verified' build/play/verify.txt

      # docs/releases/vX.Y.Z.md when written by hand, otherwise GitHub's notes since the last release;
      # plain text within Play's 500 characters. A generic line if neither is available.
      - name: Play release notes
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" build/play/notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
              --jq .body > build/play/notes.md || echo "::warning::Generated notes unavailable; using a generic line"
          fi
          python3 scripts/play_notes.py --input build/play/notes.md --output build/play/whatsnew/whatsnew-en-US
          cat build/play/whatsnew/whatsnew-en-US

      - name: Check the tag still points at the built commit
        if: steps.secrets.outputs.ready == 'true'
        env:
          EXPECTED_COMMIT: ${{ needs.authorize.outputs.commit }}
        run: |
          set -euo pipefail
          # Refuse a moved/deleted tag rather than uploading a build of a different source.
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          [ "$tag_commit" = "$EXPECTED_COMMIT" ] || { echo "::error::Release tag moved"; exit 1; }

      - name: Upload to the internal track
        if: steps.secrets.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.wooloo.mobile
          releaseFiles: build/play/wooloo-mobile-${{ needs.authorize.outputs.version }}.aab
          releaseName: ${{ needs.authorize.outputs.version }}
          track: internal
          status: completed
          mappingFile: build/play/mapping.txt
          whatsNewDirectory: build/play/whatsnew
