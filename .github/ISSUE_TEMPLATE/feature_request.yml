name: Feature request
description: Suggest something wooloo mobile could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow with your agents, away from your computer, that this would help.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, and how herdr, wooloo on the Mac or another tool handles it today, if it does.
